<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AmanOS v2.1.0</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <!-- Favicon using emoji -->
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🚀</text></svg>"
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="top-links">
      <a
        href="https://github.com/axopher"
        target="_blank"
        class="link-icon github"
        >GitHub</a
      >
      <a
        href="https://www.linkedin.com/in/aman-shrestha-117612168/"
        target="_blank"
        class="link-icon linkedin"
        >LinkedIn</a
      >
      <a href="AMANSHRESTHACV.pdf" target="_blank" class="link-icon cv">CV</a>
    </div>

    <div class="terminal-container">
      <div class="terminal-header">
        <div class="dot red-dot"></div>
        <div class="dot yellow-dot"></div>
        <div class="dot green-dot"></div>
        <span class="terminal-title">aman-os@v2.1.0</span>
      </div>
      <div class="terminal-output" id="terminalOutput"></div>
      <div class="encouragement-message">
        Type commands below to explore AmanOS and uncover more about me!
      </div>
      <div class="terminal-input-container">
        <span class="terminal-prompt">></span>
        <input
          type="text"
          id="terminalInput"
          class="terminal-input"
          autofocus
          disabled
        />
      </div>
    </div>

    <script>
      const terminalInput = document.getElementById("terminalInput");
      const terminalOutput = document.getElementById("terminalOutput");
      const body = document.body;
      let currentTheme = "dark"; // Default theme

      // Autoscroll to bottom
      function autoScroll() {
        terminalOutput.scrollTop = terminalOutput.scrollHeight;
      }

      // Function to append a line to the terminal output
      function appendToOutput(text, className = "") {
        const line = document.createElement("div");
        line.classList.add("command-output");
        if (className) {
          line.classList.add(className);
        }
        line.innerHTML = text; // Use innerHTML to allow for colored spans and links
        terminalOutput.appendChild(line);
        autoScroll();
      }

      // Simulate typing effect for initial welcome messages
      function typeWriter(text, targetElement, speed = 30, callback = null) {
        let i = 0;
        const tempSpan = document.createElement("span");
        // Check if targetElement has children, if not, append tempSpan directly
        if (targetElement.children.length === 0) {
          targetElement.appendChild(tempSpan);
        } else {
          // If it has children, append to the last child's innerHTML or create a new span
          // For multiline typing into one div, we'll just append text content
          // to a new span within the same div for simplicity.
          targetElement.appendChild(tempSpan);
        }

        targetElement.classList.add("typing-effect");
        const interval = setInterval(() => {
          if (i < text.length) {
            tempSpan.textContent += text.charAt(i);
            i++;
            autoScroll();
          } else {
            clearInterval(interval);
            targetElement.classList.remove("typing-effect");
            if (callback) callback();
          }
        }, speed);
      }

      // Function to set the theme
      function setTheme(themeName) {
        body.classList.remove(
          "light-mode",
          "red-theme",
          "blue-theme",
          "yellow-theme"
        ); // Remove all specific themes
        if (themeName !== "dark") {
          // Only add if not default dark
          body.classList.add(themeName + "-theme");
        }
        if (themeName === "light") {
          // Special case for light mode
          body.classList.add("light-mode");
        }
        currentTheme = themeName;
        appendToOutput(
          `<span class="success-message">> Theme set to '${themeName}'.</span>`
        );
      }

      // Function to display a concise help summary
      function displayInitialHelpSummary() {
        appendToOutput(
          '<div class="help-heading">=== COMMON COMMANDS ===</div>'
        );
        appendToOutput(
          '<span class="help-command">whoami</span><span class="help-description">About me</span>'
        );
        appendToOutput(
          '<span class="help-command">skills</span><span class="help-description">My tech stack</span>'
        );
        appendToOutput(
          '<span class="help-command">contact</span><span class="help-description">Connect with me</span>'
        );
        appendToOutput(
          '<span class="help-command">cv</span><span class="help-description">My Resume</span>'
        );
        appendToOutput(
          '<span class="help-command">theme &lt;mode&gt;</span><span class="help-description">Change colors (dark, light, red, blue, yellow)</span>'
        );
        appendToOutput(
          '<span class="help-command">clear</span><span class="help-description">Clear screen</span>'
        );
        appendToOutput("<br>");
        // Removed: appendToOutput('<span class="info-message">Type \'help\' for a complete list of commands.</span>');
      }

      // Available commands and their descriptions/actions
      const commands = {
        help: {
          description: "Show this help message",
          action: () => {
            appendToOutput(
              '<div class="help-heading">=== AVAILABLE COMMANDS ===</div>'
            );
            appendToOutput(
              '<span class="help-command">help</span><span class="help-description">Show this help message</span>'
            );
            appendToOutput(
              '<span class="help-command">clear</span><span class="help-description">Clear the terminal screen</span>'
            );
            appendToOutput(
              '<span class="help-command">exit</span><span class="help-description">Simulate exiting AmanOS</span>'
            );
            appendToOutput(
              '<span class="help-command">echo &lt;text&gt;</span><span class="help-description">Display the provided text</span>'
            );
            appendToOutput(
              '<span class="help-command">date</span><span class="help-description">Show current date and time</span>'
            );
            appendToOutput(
              '<span class="help-command">theme &lt;mode&gt;</span><span class="help-description">Change terminal theme (dark, light, red, blue, yellow)</span>'
            );
            appendToOutput(
              '<span class="help-command">whoami</span><span class="help-description">Display information about Aman</span>'
            );
            appendToOutput(
              '<span class="help-command">skills</span><span class="help-description">List Aman\'s technical skills</span>'
            );
            appendToOutput(
              '<span class="help-command">contact</span><span class="help-description">Get Aman\'s contact details</span>'
            );
            appendToOutput(
              '<span class="help-command">cv</span><span class="help-description">Browse Aman\'s Curriculum Vitae</span>'
            );
            appendToOutput(
              '<span class="help-command">linkedin</span><span class="help-description">Open Aman\'s LinkedIn profile</span>'
            );
            appendToOutput(
              '<span class="help-command">github</span><span class="help-description">Open Aman\'s GitHub profile</span>'
            );

            appendToOutput(
              '<span class="help-command">quote</span><span class="help-description">Display a random cookie message (simulated)</span>'
            );
            appendToOutput(
              '<div class="help-heading">Tip: Try some undocumented commands - there might be easter eggs!</div>'
            );
          },
        },
        clear: {
          description: "Clear the terminal screen",
          action: () => {
            terminalOutput.innerHTML = "";
            appendToOutput(
              '<span class="terminal-prompt">></span> Terminal cleared.',
              "success-message"
            );
          },
        },
        exit: {
          description: "Simulate exiting terminal mode",
          action: () => {
            appendToOutput(
              '<span class="terminal-prompt">></span> <span class="info-message">Exiting AmanOS. This is a simulation; in a real application, you might transition to a graphical user interface here.</span>'
            );
            // In a real app, you might hide the terminal and show a graphical UI
          },
        },
        echo: {
          description: "Display the provided text",
          action: (args) => {
            if (args.length > 0) {
              appendToOutput(
                `<span class="info-message">${args.join(" ")}</span>`
              );
            } else {
              appendToOutput(
                '<span class="error-message">Usage: echo &lt;text&gt;</span>'
              );
            }
          },
        },
        date: {
          description: "Show current date and time",
          action: () => {
            const now = new Date();
            appendToOutput(
              `<span class="info-message">Current Date & Time: ${now.toLocaleString()}</span>`
            );
          },
        },
        theme: {
          description: "Change terminal theme (dark, light, red, blue, yellow)",
          action: (args) => {
            const themeMode = args[0] ? args[0].toLowerCase() : "";
            const validThemes = ["dark", "light", "red", "blue", "yellow"];
            if (validThemes.includes(themeMode)) {
              setTheme(themeMode);
            } else {
              appendToOutput(
                '<span class="error-message">Invalid theme. Available themes: dark, light, red, blue, yellow.</span>'
              );
              appendToOutput(
                '<span class="error-message">Usage: theme &lt;mode&gt;</span>'
              );
            }
          },
        },
        whoami: {
          description: "Display information about Aman",
          action: () => {
            appendToOutput(
              '<span class="terminal-prompt">></span> <span class="info-message">Retrieving profile information...</span>'
            );
            setTimeout(() => {
              appendToOutput(`
                            <span class="info-message">
                            Software Developer with 2 years of experience on architecting and optimizing scalable web systems. Core
capabilities include designing databases, crafting high-performance APIs, and implementing complex features like
third-party integrations, web scraping, and automation. I consistently prioritize security and scalability, often
working collaboratively to drive technical excellence.
                            </span>
                        `);
            }, 500);
          },
        },
        skills: {
          description: "List Aman's technical skills.",
          action: () => {
            // Define skills in a structured way
            const skillSet = {
              Backend: "Python, Django/DRF and FastAPI",
              Frontend: "React, JavaScript and TailwindCSS",
              Databases: "PostgreSQL, MariaDB, Redis and MongoDB",
              "DevOps & Tools": "Docker, AWS, Nginx, Git/GitHub",
              Others:
                "Web Scraping, Automation, REST APIs, OAuth2.0, AI Integrations, etc.",
            };

            let output =
              '<div class="help-heading">--- Technical Skillset ---</div>';

            // Loop through the structured skills and format them
            for (const category in skillSet) {
              // Re-use the 'help-command' and 'help-description' classes for nice alignment
              output += `<div><span class="help-command" style="width: 140px;">${category}</span><span class="help-description">${skillSet[category]}</span></div>`;
            }

            appendToOutput(output);
          },
        },
        contact: {
          description: "Get Aman's contact details",
          action: () => {
            appendToOutput(
              '<span class="terminal-prompt">></span> <span class="info-message">Displaying contact details for Aman...</span>'
            );
            setTimeout(() => {
              appendToOutput(
                '<span class="info-message">Email:</span> <a href="mailto:amanshres007@gmail.com" class="link-style">amanshres007@gmail.com</a>'
              );
              appendToOutput(
                '<span class="info-message">LinkedIn:</span> <a href="https://www.linkedin.com/in/aman-shrestha-117612168/" class="link-style" target="_blank">https://www.linkedin.com/in/aman-shrestha-117612168/</a>'
              );
              appendToOutput(
                '<span class="info-message">GitHub:</span> <a href="https://github.com/axopher" class="link-style" target="_blank">https://github.com/axopher</a>'
              );
              appendToOutput(
                '<span class="info-message">CV:</span> Type <span class="command-input-line">cv</span> or click the "CV" icon above.'
              );
            }, 500);
          },
        },
        cv: {
          description: "Browse Aman's Curriculum Vitae",
          action: () => {
            appendToOutput(
              '<span class="terminal-prompt">></span> <span class="info-message">Browse Aman\'s CV (simulated)...</span>'
            );
          },
          action: () => {
            appendToOutput(
              '<span class="terminal-prompt">></span> <span class="info-message">Browse Aman\'s CV (simulated)...</span>'
            );
            setTimeout(() => {
              appendToOutput(
                '<span class="success-message">Redirecting to <a href="AMANSHRESTHACV.pdf" class="link-style" target="_blank">AMANSHRESTHACV.pdf</a>.</span>'
              );
              window.open("AMANSHRESTHACV.pdf", "_blank"); // Open in new tab
            }, 500);
          },
        },
        linkedin: {
          description: "Open Aman's LinkedIn profile",
          action: () => {
            appendToOutput(
              '<span class="terminal-prompt">></span> <span class="info-message">Opening Aman\'s LinkedIn profile...</span>'
            );
            setTimeout(() => {
              appendToOutput(
                '<span class="success-message">Redirecting to <a href="https://www.linkedin.com/in/aman-shrestha-117612168/" class="link-style" target="_blank">https://www.linkedin.com/in/aman-shrestha-117612168/</a>.</span>'
              );
              window.open(
                "https://www.linkedin.com/in/aman-shrestha-117612168/",
                "_blank"
              ); // Open in new tab
            }, 500);
          },
        },
        github: {
          description: "Open Aman's GitHub profile",
          action: () => {
            appendToOutput(
              '<span class="terminal-prompt">></span> <span class="info-message">Opening Aman\'s GitHub profile...</span>'
            );
            setTimeout(() => {
              appendToOutput(
                '<span class="success-message">Redirecting to <a href="https://github.com/axopher" class="link-style" target="_blank">https://github.com/axopher</a>.</span>'
              );
              window.open("https://github.com/axopher", "_blank"); // Open in new tab
            }, 500);
          },
        },
        quote: {
          description: "Display a random quote of the day",
          action: () => {
            const quotes = [
              "The only way to do great work is to love what you do. - Steve Jobs",
              "Any fool can write code that a computer can understand. Good programmers write code that humans can understand. - Martin Fowler",
              "Measuring programming progress by lines of code is like measuring aircraft building progress by weight. - Bill Gates",
              "The most disastrous thing that can happen to a programmer is to fall in love with his own code. - Anonymous",
              "Before software can be reusable, it first has to be usable. - Ralph Johnson",
              "In order to understand recursion, one must first understand recursion. - Anonymous",
              "It's not a bug – it's an undocumented feature. - Anonymous",
              "There are only 10 types of people in the world: those who understand binary, and those who don’t. - Anonymous",
            ];
            const randomQuote =
              quotes[Math.floor(Math.random() * quotes.length)];
            appendToOutput(
              `<span class="info-message">"${randomQuote}"</span>`
            );
          },
        },
        sudo: {
          description: "Attempt to gain superuser privileges (fails)",
          action: () => {
            const accessDeniedArt = `
<pre style="color: #ef4444; margin: 0 auto; text-align: center; font-size: 1.1em; line-height: 1.3;">
  ╔════════════════════════════╗
  ║     🔒 ACCESS DENIED 🔒     ║
  ╚════════════════════════════╝
    You need higher clearance.
     Try again… with coffee ☕
</pre>
    `;
            appendToOutput(accessDeniedArt);
            appendToOutput(
              '<span class="error-message">Permission denied. Not everyone gets to be root.</span>'
            );
            appendToOutput(
              '<span class="error-message">Nice try, but sudo doesn’t mean "super-duper-open".</span>'
            );
          },
        },
      };

      // Handle input from the terminal
      terminalInput.addEventListener("keydown", (event) => {
        if (event.key === "Enter") {
          const fullCommand = terminalInput.value.trim();
          const parts = fullCommand.split(" ");
          const command = parts[0].toLowerCase();
          const args = parts.slice(1);

          appendToOutput(
            `<span class="terminal-prompt">></span> <span class="command-input-line">${fullCommand}</span>`
          );
          terminalInput.value = ""; // Clear input

          if (commands[command]) {
            commands[command].action(args);
          } else if (command === "") {
            // Do nothing if command is empty
          } else {
            appendToOutput(
              `<span class="error-message">Command not found: '${command}'. Type 'help' for a list of commands.</span>`
            );
          }
          autoScroll();
        }
      });

      // Initial welcome message with typing effect
      window.onload = function () {
        terminalOutput.innerHTML = ""; // Clear initial static content

        // AMAN ASCII Art
        const amanArt = `
<pre style="color: var(--aman-art-color); margin: 0 auto; text-align: center; font-size: 1.2em; line-height: 1.2;">
  █████╗ ███╗   ███╗ █████╗ ███╗   ██╗
 ██╔══██╗████╗ ████║██╔══██╗████╗  ██║
 ███████║██╔████╔██║███████║██╔██╗ ██║
 ██╔══██║██║╚██╔╝██║██╔══██║██║╚██╗██║
 ██║  ██║██║ ╚═╝ ██║██║  ██║██║ ╚████║
 ╚═╝  ╚═╝╚═╝     ╚═╝╚═╝  ╚═╝╚═╝  ╚═══╝
                               <span style="color: white; font-weight: bold;">AmanOS Terminal v2.1.0</span>
</pre>
            `;

        appendToOutput(amanArt);
        appendToOutput("<br>"); // Add a line break after ASCII art

        // Welcome message lines
        const welcomeLines = [
          "Initializing AmanOS v2.1.0...",
          "Boot sequence complete. All systems online.",
          "Loading user profile: Aman Shrestha [Software Developer | Cloud Enthusiast]",
          "Welcome, Operator. Your terminal awaits. Type 'help' to explore available commands.",
        ];

        let lineIndex = 0;
        const typeNextLine = () => {
          if (lineIndex < welcomeLines.length) {
            const welcomeLineDiv = document.createElement("div");
            welcomeLineDiv.classList.add("command-output");
            terminalOutput.appendChild(welcomeLineDiv);
            typeWriter(welcomeLines[lineIndex], welcomeLineDiv, 30, () => {
              lineIndex++;
              typeNextLine();
            });
          } else {
            // All welcome lines typed, now display concise help summary
            displayInitialHelpSummary();
            // Finally, add the prompt and focus input
            const finalPromptDiv = document.createElement("div");
            finalPromptDiv.classList.add("command-output");
            const finalPromptSpan = document.createElement("span");
            finalPromptSpan.classList.add("terminal-prompt");
            finalPromptSpan.textContent = ">";
            finalPromptDiv.appendChild(finalPromptSpan);
            terminalOutput.appendChild(finalPromptDiv);
            terminalInput.removeAttribute("disabled");
            terminalInput.focus(); // Focus input after all typing animation
          }
        };

        // Start typing welcome messages after a small delay
        setTimeout(typeNextLine, 500);

        // Re-focus input field if user clicks elsewhere
        document.addEventListener("click", (e) => {
          if (
            !terminalInput.contains(e.target) &&
            !terminalOutput.contains(e.target)
          ) {
            terminalInput.focus();
          }
        });
      };
    </script>
  </body>
</html>
